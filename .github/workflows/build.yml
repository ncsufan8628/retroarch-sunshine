name: Build RetroArch Sunshine

on:
  workflow_dispatch:
  schedule:
    - cron: "22 9 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/retroarch-sunshine
  BASE_IMAGE: lscr.io/linuxserver/retroarch:latest

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      base_digest: ${{ steps.detect.outputs.base_digest }}
      sunshine_version: ${{ steps.detect.outputs.sunshine_version }}
      sunshine_deb_url: ${{ steps.detect.outputs.sunshine_deb_url }}
      image_tag: ${{ steps.detect.outputs.image_tag }}

    steps:
      - name: Detect upstream versions
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"

          SUNSHINE_JSON="$(curl -fsSL https://api.github.com/repos/LizardByte/Sunshine/releases/latest)"

          SUNSHINE_VERSION="$(echo "$SUNSHINE_JSON" | jq -r '.tag_name')"

          SUNSHINE_DEB_URL="$(echo "$SUNSHINE_JSON" | jq -r '
            .assets[]
            | select(.name == "sunshine-ubuntu-24.04-amd64.deb")
            | .browser_download_url
          ')"

          if [ -z "$SUNSHINE_DEB_URL" ] || [ "$SUNSHINE_DEB_URL" = "null" ]; then
            echo "Could not find Sunshine amd64 .deb asset"
            exit 1
          fi

          IMAGE_TAG="${SUNSHINE_VERSION}-${BASE_DIGEST#sha256:}"
          IMAGE_TAG="${IMAGE_TAG:0:40}"

          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "sunshine_version=$SUNSHINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sunshine_deb_url=$SUNSHINE_DEB_URL" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Show detected versions
        run: |
          echo "RetroArch digest: ${{ steps.detect.outputs.base_digest }}"
          echo "Sunshine version: ${{ steps.detect.outputs.sunshine_version }}"

  build:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if image already exists
        id: exists
        shell: bash
        run: |
          set +e

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${{ needs.detect.outputs.image_tag }}" \
            >/dev/null 2>&1

          if [ $? -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64

          build-args: |
            SUNSHINE_VERSION=${{ needs.detect.outputs.sunshine_version }}
            SUNSHINE_DEB_URL=${{ needs.detect.outputs.sunshine_deb_url }}

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.image_tag }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.detect.outputs.sunshine_version }}
            io.linuxserver.retroarch.digest=${{ needs.detect.outputs.base_digest }}

          cache-from: type=gha
          cache-to: type=gha,mode=max